<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Space Empires IV — OpenSE4 Browser</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#132035"></head><body><aside id="app-update" class="app-update" hidden role="status"><strong id="update-heading">App update</strong><p id="update-message"></p><button id="apply-update">Save &amp; update</button><button id="defer-update">Later</button></aside><main id="screen">
<header><div class="emblem">SPACE EMPIRES <strong>IV</strong></div></header>
<section id="menu" class="classic-menu"><h1>MAIN MENU</h1><button id="new-game" disabled>New Game</button><button id="quick" disabled>Quick Game</button><button id="resume" disabled>Return to Game</button><button id="menu-load" disabled>Load Game</button><button id="learn-menu" disabled data-unavailable="true" title="Tutorial scenarios are being revised">Learn</button><button id="online-menu">Online games</button><button id="install-app" hidden>Install app</button><p id="install-help" hidden></p><button id="restore-autosave">Restore autosave</button><p class="caution">Build your empire. Explore the galaxy. Play at your own pace.</p></section>
<section id="race-selection" hidden><div class="heading"><h1>QUICK START — SELECT EMPIRE</h1><button id="back">Back</button></div><div id="race-grid" class="race-grid"></div><p id="selection-summary" aria-live="polite"></p><section id="race-details" class="race-details" aria-label="Original race setup"></section><div class="setup-options"><label>Galaxy seed <input id="seed" type="number" min="0" max="1000000" placeholder="Random" value=""></label><label>Computer AI <select id="ai-mode"><option value="classic" selected>Classic AI — original SE4</option><option value="hegemon" disabled>Hegemon AI — requires scripting runtime</option></select></label></div><p class="ai-note" id="ai-note">Choose the computer opponent AI for this game.</p><div class="actions"><button id="begin" disabled>Begin Game</button></div></section>
<section id="learning" hidden></section><section id="online" hidden></section><section id="new-game-setup" hidden></section><section id="handoff" hidden></section>
<section id="game" hidden class="game-panel">
 <div class="empire-toolbar"><div class="heading"><h1 id="game-title">EMPIRE STATUS</h1><details class="game-menu"><summary aria-label="Menu">☰</summary><nav class="game-menu-options" aria-label="Game options"><button id="game-back">Main menu</button><button id="save-game">Save game</button><button id="load-game">Load game</button><button id="learn-game">Learn</button><button id="check-updates">Check for updates</button><small id="app-build">Build information unavailable</small></nav></details></div>
 <div id="game-summary" aria-label="Empire overview"></div><div class="game-actions"><button id="end-turn">End Turn</button><button id="skip-turn-task">Skip</button></div>
 <div id="turn-guide" hidden><span id="turn-task-count" hidden></span></div></div>
 <nav id="game-tabs" aria-label="Empire screens"><button data-tab="maps" aria-pressed="true">Maps</button><button data-tab="colonies">Colonies</button><button data-tab="research">Research</button><button data-tab="designs">Designs</button><button data-tab="ships">Ships</button><button data-tab="log">Log</button><button data-tab="status">Status</button></nav>
 <div id="game-content"></div>
</section>
<input id="save-file" type="file" accept=".json,.txt" hidden>
<footer id="status" role="status" aria-live="polite">Starting game engine…</footer></main><script type="module" src="src/app.js"></script></body></html>
